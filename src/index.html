<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookWorm Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@300;400;700&family=Public+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #f3f4f6;
        background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
        background-size: 32px 32px;
        color: #0e1111;
        overflow-x: hidden;
      }
      /* Custom scrollbar for a polished look */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #0e1111;
        border-left: 2px solid #0e1111;
      }
      ::-webkit-scrollbar-thumb {
        background: #FFD900;
        border: 2px solid #0e1111;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF90E8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
